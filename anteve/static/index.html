<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antevê | Radar de recuperações judiciais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#023631; --ciano-esc:#075056; --off:#ECEFF3; --verde-cl:#0A5A52; --profundo:#012824;
  --ciano:#2A7C79; --ciano-prof:#0E4442; --chumbo:#4A545E; --branco:#FFFFFF; --preto:#000000;
  --fundo:var(--off); --superficie:var(--branco); --texto:var(--preto); --texto2:var(--chumbo);
  --linha:#D5DBE1; --nav:var(--verde); --nav-texto:var(--branco); --destaque:var(--ciano-esc);
  --st-conf:var(--verde); --st-prov:var(--ciano); --st-prev:var(--chumbo);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fundo:#011c19; --superficie:#02302b; --texto:#FFFFFF; --texto2:#B7C3C8; --linha:#0E4442;
  --nav:#012824; --destaque:#2A7C79; --st-conf:#ECEFF3; --st-prov:#5fb3ae; --st-prev:#B7C3C8;}}
:root[data-theme="dark"]{--fundo:#011c19; --superficie:#02302b; --texto:#FFFFFF; --texto2:#B7C3C8; --linha:#0E4442;
  --nav:#012824; --destaque:#2A7C79; --st-conf:#ECEFF3; --st-prov:#5fb3ae; --st-prev:#B7C3C8;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--fundo);color:var(--texto);
  font-family:"Plus Jakarta Sans",Calibri,"Segoe UI",sans-serif;font-weight:300;font-size:15px;line-height:1.5}
b,strong,h1,h2,h3,th,.sb{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--destaque)}
:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;height:100%}
nav.lateral{background:var(--nav);color:var(--nav-texto);display:flex;flex-direction:column;padding:28px 18px;gap:4px;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;margin:0 6px 28px}
.marca svg{flex:none}
.marca .nome{font-weight:600;font-size:22px;letter-spacing:-.01em}
.marca .pill{background:var(--ciano-esc);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600}
nav.lateral button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:#cfe0de}
nav.lateral button[aria-current="page"]{background:var(--ciano-esc);color:#fff;font-weight:600}
nav.lateral button:hover{background:rgba(255,255,255,.07)}
nav.lateral .cont{font-size:12px;opacity:.85}
.nav-rodape{margin-top:auto;font-size:12px;color:#9fb7b4;padding:0 6px}
.nav-rodape button{padding:6px 0;color:#cfe0de;text-decoration:underline}

main{overflow:auto;padding:30px clamp(16px,3vw,40px) 60px}
.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.015em;color:var(--texto)}
.sub{color:var(--texto2);margin:6px 0 0;max-width:70ch}
.aviso-modo{background:var(--superficie);border:1px solid var(--linha);border-left:4px solid var(--ciano);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13.5px;color:var(--texto2)}

/* números da camada */
.camadas{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.camada{background:var(--superficie);border-radius:12px;padding:14px 16px;border:1px solid var(--linha)}
.camada .n{font-size:26px;font-weight:600}
.camada .r{color:var(--texto2);font-size:13px}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filtros select,.filtros input,.campo{background:var(--superficie);border:1px solid var(--linha);border-radius:8px;padding:8px 10px;min-height:38px}
.filtros input[type=search]{min-width:240px;flex:1}
.btn{cursor:pointer;border:1px solid var(--verde);background:var(--verde);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;min-height:38px}
.btn.sec{background:transparent;color:var(--texto);border-color:var(--linha)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tabela */
.tabela-wrap{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th{text-align:left;font-size:12.5px;color:var(--texto2);padding:11px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--linha);vertical-align:top;font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(42,124,121,.07)}
.cnj{font-variant-numeric:tabular-nums;white-space:nowrap}
.fraco{color:var(--texto2);font-size:12.5px}

/* estados: confirmados, provisórios e preventivos nunca compartilham cor nem forma */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1.5px solid transparent}
.st.CONFIRMADO,.st.ATUALIZADO{background:var(--st-conf);color:var(--superficie)}
.st.PROVISORIO,.st.CANDIDATO{border:1.5px dashed var(--st-prov);color:var(--st-prov)}
.st.PREVENTIVO{color:var(--texto);border-color:var(--st-prev);
  background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(74,84,94,.28) 4px 6px)}
.st.ENCERRADO,.st.DESCARTADO{border-color:var(--linha);color:var(--texto2)}
.pr{font-size:12.5px;white-space:nowrap}
.pr::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--linha)}
.pr.URGENTE::before{background:var(--verde);box-shadow:0 0 0 2px var(--ciano)}
.pr.ALTA::before{background:var(--ciano-esc)}.pr.MEDIA::before{background:var(--ciano)}

/* linha de latência: ajuizamento, disponível na fonte, descoberta */
.lat{width:170px}
.lat .trilho{position:relative;height:6px;background:var(--linha);border-radius:3px;margin:6px 0 4px}
.lat .seg1{position:absolute;left:0;top:0;height:6px;background:var(--ciano);border-radius:3px 0 0 3px}
.lat .seg2{position:absolute;top:0;height:6px;background:var(--verde);border-radius:0 3px 3px 0}
:root[data-theme="dark"] .lat .seg2{background:#ECEFF3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lat .seg2{background:#ECEFF3}}
.lat .leg{font-size:11.5px;color:var(--texto2);display:flex;justify-content:space-between}

.conf{font-variant-numeric:tabular-nums}
.conf small{display:block;color:var(--texto2);font-size:11.5px}
.bloq{font-size:11.5px;color:var(--texto2)}

/* gaveta de detalhe */
.gaveta{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--superficie);box-shadow:-18px 0 40px rgba(1,40,36,.18);
  transform:translateX(100%);transition:transform .22s ease;overflow:auto;z-index:20;padding:calc(24px + env(safe-area-inset-top,0px)) 26px calc(40px + env(safe-area-inset-bottom,0px))}
.gaveta.aberta{transform:none}
.veu{position:fixed;inset:0;background:rgba(1,40,36,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}
.veu.on{opacity:1;pointer-events:auto}
.gaveta h2{font-size:20px;margin:6px 0 4px}
.gaveta h3{font-size:14.5px;margin:22px 0 8px;color:var(--destaque)}
.grade{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.grade dt{color:var(--texto2)}.grade dd{margin:0}
.item{border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.item .t{font-weight:600}
.nivel{display:inline-block;min-width:22px;text-align:center;border-radius:6px;background:var(--ciano-esc);color:#fff;font-size:12px;font-weight:600;margin-right:6px}
.alerta-nc{border:1.5px dashed var(--st-prov);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13.5px}
.formulario{display:grid;gap:8px;margin-top:8px}
.formulario label{font-size:13px;color:var(--texto2);display:grid;gap:4px}
.fechar{float:right}
.vazio{padding:40px 20px;text-align:center;color:var(--texto2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kpi{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:16px}
.kpi .v{font-size:28px;font-weight:600}
.kpi .m{font-size:12.5px;color:var(--texto2)}
.barra{height:6px;background:var(--linha);border-radius:3px;margin-top:10px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ciano-esc)}
.saude{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.saude .c{background:var(--superficie);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;font-size:13px}
.saude .c.INDISPONIVEL,.saude .c.INTERROMPIDO_ESQUEMA{border:1.5px dashed var(--st-prov)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ciano);margin-right:6px}
.c.INDISPONIVEL .dot,.c.INTERROMPIDO_ESQUEMA .dot{background:transparent;border:1.5px solid var(--chumbo)}
.login{max-width:420px;margin:12vh auto;background:var(--superficie);border-radius:14px;padding:28px;border:1px solid var(--linha)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--verde);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;display:none;max-width:90%}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav.lateral{flex-direction:row;overflow-x:auto;padding:12px;gap:2px}
  .marca{margin:0 10px 0 0}.nav-rodape{display:none}
  nav.lateral button{white-space:nowrap}
  .grade{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.gaveta,.veu{transition:none}}
</style>
</head>
<body>
<div id="raiz"></div>
<div class="veu" id="veu"></div>
<aside class="gaveta" id="gaveta" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
const SNAP = window.ANTEVE_SNAPSHOT || null;
const $ = s => document.querySelector(s);
const esc = v => (v===null||v===undefined?"":String(v)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const guardar = (k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const ler = k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let TOKEN = SNAP ? null : ler("anteve_token");
let EU = SNAP ? {nome:"Prévia",papel:"leitor",permissoes:["ler","preventivo","revisar"]} : null;
let VIEW = "painel", CACHE = {}, SAUDE = null;
const ROTULO = {
  RJ_PEDIDO_NOVO:"Pedido de RJ", RJ_TUTELA_ANTECEDENTE:"Tutela antecedente", RJ_PROCESSAMENTO_DEFERIDO:"Processamento deferido",
  RJ_PROCESSAMENTO_INDEFERIDO:"Pedido indeferido", RJ_PLANO_APRESENTADO:"Plano apresentado", RJ_CONCEDIDA:"RJ concedida",
  RJ_FALENCIA:"Convolação em falência", RE_EXTRAJUDICIAL:"Recuperação extrajudicial", PEDIDO_FALENCIA:"Pedido de falência",
  INCIDENTE_RELACIONADO:"Incidente relacionado", REVISAO_MANUAL:"Revisão manual", NAO_RELACIONADO:"Não relacionado"};
const ESTAGIO = {
  PEDIDO_DISTRIBUIDO_AGUARDANDO_DECISAO:"Distribuído, aguardando decisão", INDICIO_DE_DEFERIMENTO:"Indício de deferimento (confirmar)",
  INDICIO_DE_INDEFERIMENTO:"Indício de indeferimento (confirmar)", PROCESSAMENTO_DEFERIDO:"Processamento deferido", CONCEDIDA:"Concedida",
  CONVOLADA_EM_FALENCIA:"Convolada em falência", DISTRIBUICAO_CANCELADA:"Distribuição cancelada", DESISTENCIA:"Desistência",
  INDEFERIDO:"Indeferido", BAIXADO:"Baixado"};
const STATUS = {CONFIRMADO:"Confirmado",ATUALIZADO:"Atualizado",PROVISORIO:"Provisório",CANDIDATO:"Candidato",ENCERRADO:"Encerrado",DESCARTADO:"Descartado",PREVENTIVO:"Preventivo"};
const PRIO = {URGENTE:"Urgente",ALTA:"Alta",MEDIA:"Média",MONITORAMENTO:"Monitoramento"};
const IDADE = {NOVO:"Novo (até 7 dias)",RECENTE:"Recente (8 a 30 dias)",HISTORICO:"Histórico (mais de 30 dias)"};
const dt = s => { if(!s) return "sem data"; const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}); };
const dth = s => { if(!s) return "sem data"; const d=new Date(s); return isNaN(d)?s:d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const pode = p => EU && EU.permissoes.includes(p);
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3800);}

/* ---------- acesso a dados: API real ou prévia estática ---------- */
async function api(caminho, opts={}){
  if(SNAP) return snapApi(caminho, opts);
  const r = await fetch(caminho,{...opts,headers:{"Content-Type":"application/json","X-Token":TOKEN||"",...(opts.headers||{})}});
  if(r.status===401){ guardar("anteve_token",null); TOKEN=null; EU=null; render(); throw new Error("sessão expirada"); }
  if(!r.ok){ let d; try{d=(await r.json()).detail}catch(e){} throw new Error(typeof d==="string"?d:("erro "+r.status)); }
  const ct=r.headers.get("content-type")||"";
  return ct.includes("json")? r.json() : r.text();
}
function snapApi(caminho, opts){
  if(opts.method && opts.method!=="GET") return Promise.reject(new Error("A prévia é somente leitura. Ações ficam disponíveis no sistema instalado."));
  const u = new URL(caminho, location.href), p = u.pathname, q = u.searchParams;
  if(p==="/api/processos"){
    const camada=q.get("camada")||"rj";
    let l = SNAP.processos.filter(x=>x.status!=="DESCARTADO");
    if(camada==="rj") l=l.filter(x=>(x.tipo_evento||"").startsWith("RJ_"));
    if(camada==="outros") l=l.filter(x=>!(x.tipo_evento||"").startsWith("RJ_"));
    for(const [k,c] of [["status","status"],["uf","uf"],["idade","idade"],["prioridade","prioridade"],["tribunal","tribunal"]]) if(q.get(k)) l=l.filter(x=>x[c]===q.get(k));
    const t=(q.get("q")||"").toLowerCase(); if(t) l=l.filter(x=>(x.numero_cnj+" "+(x.vara||"")).toLowerCase().includes(t));
    return Promise.resolve(l);
  }
  if(p.startsWith("/api/processos/")) return Promise.resolve(SNAP.processos.find(x=>x.numero_cnj===decodeURIComponent(p.split("/")[3])));
  const mapa={"/api/revisoes":SNAP.revisoes,"/api/alertas":SNAP.alertas,"/api/fontes":SNAP.fontes,"/api/metricas":SNAP.metricas,
    "/api/preventivo":SNAP.preventivo||[],"/api/catalogo-sinais":SNAP.catalogo,"/api/preferencias":{}};
  if(p==="/api/revisoes"){ let l=SNAP.revisoes; if(q.get("fila")) l=l.filter(r=>r.fila===q.get("fila")); return Promise.resolve(l); }
  return Promise.resolve(mapa[p]);
}

/* ---------- estrutura ---------- */
const VISOES = [["painel","Novas recuperações"],["outros","Falência e extrajudicial"],["revisao","Revisão humana"],["preventivo","Preventivo"],
  ["alertas","Alertas"],["fontes","Fontes e saúde"],["metricas","Métricas"],["preferencias","Preferências"]];
const MARCA = `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="7" width="17" height="21" rx="4" fill="#2A7C79" opacity=".75"/><rect x="11" y="2" width="17" height="21" rx="4" fill="#ECEFF3"/></svg>`;

function render(){
  const raiz=$("#raiz");
  if(!SNAP && !EU){
    raiz.innerHTML=`<div class="login"><div class="marca" style="color:var(--texto)">${MARCA}<span class="nome">Antevê</span></div>
      <h1 style="font-size:22px">Entrar</h1><p class="sub">Informe o token de acesso gerado pelo administrador com <code>python -m anteve.cli iniciar</code>.</p>
      <div class="formulario"><label>Token<input class="campo" id="tk" type="password" autocomplete="off"></label>
      <button class="btn" id="entrar">Entrar</button></div></div>`;
    $("#entrar").onclick=async()=>{TOKEN=$("#tk").value.trim(); try{EU=await api("/api/eu"); guardar("anteve_token",TOKEN); render();}catch(e){toast(e.message)}};
    return;
  }
  raiz.innerHTML=`<div class="app"><nav class="lateral" aria-label="Seções">
    <div class="marca">${MARCA}<span class="nome">Antevê</span><span class="pill">IA</span></div>
    ${VISOES.filter(([v])=>!(v==="preventivo"&&!pode("preventivo"))&&!(v==="revisao"&&!pode("revisar"))).map(([v,n])=>`<button data-v="${v}" ${VIEW===v?'aria-current="page"':""}><span>${n}</span><span class="cont" id="c-${v}"></span></button>`).join("")}
    <div class="nav-rodape">${SNAP?`Prévia gerada em ${dth(SNAP.gerado_em)}`:`${esc(EU.nome)} (${esc(EU.papel)})<br><button id="sair">Sair</button>`}</div>
  </nav><main id="main" tabindex="-1"></main></div>`;
  document.querySelectorAll("nav.lateral button[data-v]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render();});
  if($("#sair")) $("#sair").onclick=()=>{guardar("anteve_token",null);TOKEN=null;EU=null;render();};
  VISTAS[VIEW]();
  contadores();
}
async function contadores(){
  try{const r=await api("/api/revisoes"); const e=$("#c-revisao"); if(e) e.textContent=r.length||"";}catch(e){}
}
function cab(titulo, sub, extra=""){
  return `${SAUDE&&!SAUDE.persistente?`<div class="aviso-modo"><b>Banco não persistente.</b> Este ambiente está sem DATABASE_URL e grava em armazenamento temporário, que é apagado a cada nova instância. Configure um PostgreSQL antes de operar.</div>`:""}${SNAP?`<div class="aviso-modo">Prévia somente leitura com metadados públicos reais coletados do DataJud/CNJ em ${dth(SNAP.gerado_em)}. A API pública não informa partes; por isso as empresas aparecem como pendentes de identificação e o contato está bloqueado, como exige a especificação.</div>`:""}
  <div class="topo"><div><h1>${titulo}</h1><p class="sub">${sub}</p></div>${extra}</div>`;
}

/* ---------- painel principal ---------- */
function linhaLat(p){
  const a=p.data_ajuizamento?new Date(p.data_ajuizamento):null, f=p.data_disponivel_fonte?new Date(p.data_disponivel_fonte):null, d=p.data_descoberta?new Date(p.data_descoberta):null;
  if(!a||!d) return `<span class="fraco">sem datas</span>`;
  const tot=Math.max(d-a,1), fa=f&&f>a&&f<=d?(f-a)/tot*100:100;
  const dias=x=>{const n=x/864e5; return n<1?Math.round(x/36e5)+" h":Math.round(n)+" d"};
  return `<div class="lat" title="Ajuizamento ${dt(p.data_ajuizamento)}; disponível na fonte ${dt(p.data_disponivel_fonte)}; descoberta ${dth(p.data_descoberta)}">
    <div class="leg"><span>${dt(p.data_ajuizamento)}</span><span>+${dias(d-a)}</span></div>
    <div class="trilho"><div class="seg1" style="width:${fa}%"></div><div class="seg2" style="left:${fa}%;width:${100-fa}%"></div></div>
    <div class="leg"><span>até a fonte ${f?dias(Math.max(f-a,0)):"?"}</span><span>descoberta</span></div></div>`;
}
function empresaCel(p){
  if(p.empresas&&p.empresas.length){
    const e=p.empresas[0];
    return `<b>${esc(e.razao_social||"Razão social não informada")}</b><div class="fraco">${esc(e.cnpj_formatado||"")}${p.empresas.length>1?` e mais ${p.empresas.length-1}`:""}</div>`;
  }
  return `<span class="fraco">Empresa não identificada</span><div class="bloq">identidade pendente</div>`;
}
async function vistaLista(camada){
  const main=$("#main");
  const titulo = camada==="rj"?"Novas recuperações judiciais":"Falência e recuperação extrajudicial";
  const sub = camada==="rj"?"Pedidos identificados em fonte oficial, com evidência, confiança e estágio. Provisórios exigem validação humana antes de qualquer oferta."
    :"Pedidos de falência (sinal preventivo relevante, não é RJ) e recuperações extrajudiciais, mantidos em camada separada.";
  const f = CACHE["f_"+camada] || (CACHE["f_"+camada]={status:"",uf:"",idade:"",prioridade:"",q:""});
  main.innerHTML = cab(titulo, sub, !SNAP&&pode("exportar")&&camada==="rj"?`<button class="btn sec" id="exp">Exportar confirmadas (CSV)</button>`:"")+
    `<div class="camadas" id="camadas"></div>
     <div class="filtros" role="search">

      <select id="fstatus" aria-label="Status"><option value="">Todos os status</option>${["CONFIRMADO","ATUALIZADO","PROVISORIO","CANDIDATO","ENCERRADO"].map(s=>`<option value="${s}">${STATUS[s]}</option>`).join("")}</select>
      <select id="fidade" aria-label="Idade"><option value="">Qualquer idade</option>${Object.entries(IDADE).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
      <select id="fprio" aria-label="Prioridade"><option value="">Qualquer prioridade</option>${Object.entries(PRIO).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
      <select id="fuf" aria-label="UF"><option value="">Todas as UFs</option>${"AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO".split(" ").map(u=>`<option>${u}</option>`).join("")}</select>
     </div><div class="tabela-wrap"><div class="vazio">Carregando</div></div>`;
  for(const [id,k] of [["fstatus","status"],["fidade","idade"],["fprio","prioridade"],["fuf","uf"]]){ $("#"+id).value=f[k]; $("#"+id).onchange=e=>{f[k]=e.target.value;carregar();}; }
  let tq; $("#fq").oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{f.q=e.target.value;carregar();},300)};
  if($("#exp")) $("#exp").onclick=exportar;
  async function carregar(){
    const qs=new URLSearchParams({camada,...Object.fromEntries(Object.entries(f).filter(([,v])=>v))});
    let l; try{l=await api("/api/processos?"+qs);}catch(e){$(".tabela-wrap").innerHTML=`<div class="vazio">${esc(e.message)}</div>`;return;}
    const cnt=s=>l.filter(p=>s.includes(p.status)).length;
    $("#camadas").innerHTML=[["Confirmados ativos",cnt(["CONFIRMADO","ATUALIZADO"]),"pedido validado em fonte oficial"],
      ["Provisórios",cnt(["PROVISORIO","CANDIDATO"]),"divergência ou confirmação insuficiente"],
      ["Encerrados",cnt(["ENCERRADO"]),"indeferidos, cancelados, desistências"],
      ["Contato liberado",l.filter(p=>!p.contato_bloqueado).length,"CNPJ verificado e sem pendência"]]
      .map(([r,n,d])=>`<div class="camada"><div class="r">${r}</div><div class="n">${n}</div><div class="r">${d}</div></div>`).join("");
    const w=$(".tabela-wrap");
    if(!l.length){w.innerHTML=`<div class="vazio">Nenhum registro com estes filtros.</div>`;return;}
    w.innerHTML=`<table><thead><tr><th>Empresa e CNPJ</th><th>Evento e estágio</th><th>Datas e latência</th><th>Tribunal e processo</th><th>Confiança</th><th>Prioridade</th><th>Status</th></tr></thead><tbody>
      ${l.slice(0,600).map(p=>`<tr data-cnj="${esc(p.numero_cnj)}" tabindex="0">
        <td>${empresaCel(p)}</td>
        <td><b>${esc(ROTULO[p.tipo_evento]||p.tipo_evento)}</b><div class="fraco">${esc(ESTAGIO[p.estagio]||"")}</div></td>
        <td>${linhaLat(p)}</td>
        <td><span class="cnj">${esc(p.numero_cnj)}</span><div class="fraco">${esc(p.tribunal)} | ${esc(p.vara||"")}</div></td>
        <td class="conf">${Math.round((p.confianca||0)*100)}%<small>${(p.inconsistencias||[]).length?`${p.inconsistencias.length} divergência(s)`:"sem divergência"}</small></td>
        <td><span class="pr ${esc(p.prioridade)}">${esc(PRIO[p.prioridade]||p.prioridade)}</span></td>
        <td><span class="st ${esc(p.status)}">${esc(STATUS[p.status]||p.status)}</span>${p.contato_bloqueado?`<div class="bloq">contato bloqueado</div>`:""}</td></tr>`).join("")}
      </tbody></table>${l.length>600?`<div class="vazio">Exibindo 600 de ${l.length}. Refine os filtros.</div>`:""}`;
    w.querySelectorAll("tr[data-cnj]").forEach(tr=>{tr.onclick=()=>abrir(tr.dataset.cnj); tr.onkeydown=e=>{if(e.key==="Enter")abrir(tr.dataset.cnj)};});
  }
  carregar();
}
async function exportar(){
  try{const r=await fetch("/api/exportar.csv",{headers:{"X-Token":TOKEN}}); if(!r.ok) throw new Error("exportação negada");
    const b=await r.blob(); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="anteve_rj_confirmadas.csv"; a.click();}
  catch(e){toast(e.message)}
}

      <div class="fraco">${esc([e.municipio,e.uf,e.porte,e.cnae,e.situacao_cadastral].filter(Boolean).join(" | "))}</div>${e.aliases&&e.aliases!=="[]"?`<div class="fraco">Outros nomes: ${esc(JSON.parse(e.aliases).join(", "))}</div>`:""}</div>`).join("")
      :`<div class="item">Empresa requerente não identificada. A API pública do DataJud não informa partes. Contato bloqueado até vincular CNPJ com evidência.</div>`}
    ${!SNAP&&pode("revisar")?`<details><summary>Vincular identidade</summary><div class="formulario">
      <label>CNPJ<input class="campo" id="icnpj" placeholder="00.000.000/0000-00"></label>

    <h3 style="color:var(--destaque)">Dicionário TPU</h3><div class="item">Versão vigente <b>${esc(d.tpu.versao)}</b> <span class="fraco">hash ${esc((d.tpu.hash||"").slice(0,16))}</span></div>
    <h3 style="color:var(--destaque)">Cursores incrementais</h3>${d.cursores.length?d.cursores.map(c=>`<div class="item fraco">${esc(c.fonte)} ${esc(c.tribunal)} | até ${dth(c.cursor_ts)} | janela sobreposta de 72 h aplicada na próxima coleta</div>`).join(""):`<div class="fraco">Sem cursores.</div>`}
    <h3 style="color:var(--destaque)">Execuções recentes</h3>${d.execucoes.map(e=>`<div class="item fraco">${esc(e.tipo)} | ${dth(e.inicio)} até ${dth(e.fim)}</div>`).join("")||`<div class="fraco">Sem execuções.</div>`}`;
  if($("#col")) $("#col").onclick=async()=>{toast("Coleta iniciada; pode levar alguns minutos");try{await api("/api/coleta",{method:"POST",body:"{}"});toast("Coleta concluída");vistaFontes();}catch(e){toast(e.message)}};
  if($("#tpu")) $("#tpu").onclick=async()=>{try{const r=await api("/api/tpu/sincronizar",{method:"POST",body:"{}"});toast(`TPU ${r.versao}: ${r.conferidos} códigos conferidos`);vistaFontes();}catch(e){toast(e.message)}};
}

/* ---------- métricas ---------- */
async function vistaMetricas(){
  const main=$("#main");
  main.innerHTML=cab("Métricas de sucesso","Indicadores da especificação, medidos sobre a operação real.")+`<div id="lm"><div class="vazio">Carregando</div></div>`;
  let m; try{m=await api("/api/metricas");}catch(e){$("#lm").innerHTML=`<div class="vazio">${esc(e.message)}</div>`;return;}
  const k=(t,v,meta,det,pct)=>`<div class="kpi"><div class="fraco">${t}</div><div class="v">${v==null?"sem dados":v}</div><div class="m">Meta ${esc(meta)}</div><div class="m">${det}</div>${pct!=null?`<div class="barra"><i style="width:${Math.min(100,pct)}%"></i></div>`:""}</div>`;
  $("#lm").innerHTML=`<div class="kpis">
    ${k("Cobertura confirmada",m.cobertura.valor!=null?m.cobertura.valor+"%":null,m.cobertura.meta,m.cobertura.amostra?`${m.cobertura.achados} de ${m.cobertura.amostra} da amostra de controle`:"carregue uma amostra oficial de controle para medir",m.cobertura.valor)}
    ${k("Precisão confirmada",m.precisao.valor!=null?m.precisao.valor+"%":null,m.precisao.meta,m.precisao.decisoes_humanas?`${m.precisao.classificados} classificados; ${m.precisao.descartados_em_revisao} descartados em revisão`:"medida a partir das decisões da fila de revisão humana",m.precisao.valor)}
    ${k("Latência na fonte (P50 | P95)",m.latencia_fonte_h.p50!=null?`${m.latencia_fonte_h.p50} h | ${m.latencia_fonte_h.p95} h`:null,m.latencia_fonte_h.meta,`${m.latencia_fonte_h.amostras} amostras após a primeira coleta incremental`)}
    ${k("Atraso judicial médio",m.latencia_judicial_h.media!=null?Math.round(m.latencia_judicial_h.media/24)+" dias":null,"informativo",esc(m.latencia_judicial_h.observacao))}
    ${k("Deduplicação",m.deduplicacao.valor!=null?m.deduplicacao.valor+"%":null,m.deduplicacao.meta,`${m.deduplicacao.registros_brutos} registros brutos consolidados em ${m.deduplicacao.processos_unicos} processos`,m.deduplicacao.valor)}
    ${k("Rastreabilidade",m.rastreabilidade.valor!=null?m.rastreabilidade.valor+"%":null,m.rastreabilidade.meta,"alertas com fonte, evidência e versão da regra",m.rastreabilidade.valor)}
  </div><h3 style="color:var(--destaque)">Distribuição</h3><div class="kpis">
    <div class="kpi"><div class="fraco">Por status</div>${m.por_status.map(s=>`<div>${esc(STATUS[s.status]||s.status)}: <b>${s.n}</b></div>`).join("")}</div>
    <div class="kpi"><div class="fraco">Por tipo de evento</div>${m.por_tipo.map(s=>`<div>${esc(ROTULO[s.tipo_evento]||s.tipo_evento)}: <b>${s.n}</b></div>`).join("")}</div>
    <div class="kpi"><div class="fraco">Revisões pendentes</div>${m.revisoes_pendentes.map(s=>`<div>${esc(s.fila)}: <b>${s.n}</b></div>`).join("")||"nenhuma"}</div></div>`;
}

/* ---------- preferências ---------- */
async function vistaPreferencias(){
  const main=$("#main");
  if(SNAP){ main.innerHTML=cab("Preferências de alerta","Disponível no sistema instalado: tribunais, UFs, eventos, canais (e-mail, webhook, Slack, Teams) e frequência imediata ou diária."); return; }
  const p=await api("/api/preferencias").catch(()=>({}));
  main.innerHTML=cab("Preferências de alerta","Escolha o que chega até você. Correções sempre são enviadas a quem recebeu o alerta original.")+
   `<div class="formulario" style="max-width:640px">
    <label>Tribunais (separados por vírgula, vazio para todos)<input class="campo" id="pt" value="${esc(p.tribunais||"")}" placeholder="TJSP, TJRJ"></label>
    <label>UFs<input class="campo" id="pu" value="${esc(p.ufs||"")}" placeholder="SP, RJ, MG"></label>
    <label>Eventos<input class="campo" id="pe" value="${esc(p.eventos||"")}" placeholder="RJ_PEDIDO_NOVO, RJ_PROCESSAMENTO_DEFERIDO"></label>
    <label>Canais<input class="campo" id="pc" value="${esc(p.canais||"")}" placeholder="email, webhook, slack, teams"></label>
    <label>Frequência<select class="campo" id="pf"><option value="IMEDIATA">Imediata</option><option value="DIARIA">Resumo diário</option></select></label>
    <label>E-mail<input class="campo" id="pm" value="${esc(p.email||"")}"></label>
    <label>Webhook<input class="campo" id="pw" value="${esc(p.webhook_url||"")}"></label>
    <label>Slack (incoming webhook)<input class="campo" id="ps" value="${esc(p.slack_url||"")}"></label>
    <label>Teams (incoming webhook)<input class="campo" id="pte" value="${esc(p.teams_url||"")}"></label>
    ${pode("preventivo")?`<label><span><input type="checkbox" id="pp" ${p.incluir_preventivo?"checked":""}> Receber alertas preventivos revisados</span></label>`:""}
    <button class="btn" id="psalvar">Salvar</button></div>`;
  $("#pf").value=p.frequencia||"IMEDIATA";
  $("#psalvar").onclick=async()=>{try{await api("/api/preferencias",{method:"POST",body:JSON.stringify({tribunais:$("#pt").value||null,ufs:$("#pu").value||null,eventos:$("#pe").value||null,canais:$("#pc").value||null,frequencia:$("#pf").value,email:$("#pm").value||null,webhook_url:$("#pw").value||null,slack_url:$("#ps").value||null,teams_url:$("#pte").value||null,incluir_preventivo:$("#pp")?$("#pp").checked:false})});toast("Preferências salvas");}catch(e){toast(e.message)}};
}

const VISTAS={painel:()=>vistaLista("rj"),outros:()=>vistaLista("outros"),revisao:vistaRevisao,preventivo:vistaPreventivo,alertas:vistaAlertas,fontes:vistaFontes,metricas:vistaMetricas,preferencias:vistaPreferencias};

(async function iniciar(){
  if(!SNAP){ try{SAUDE=await (await fetch("/api/saude")).json();}catch(e){} }
  if(!SNAP && TOKEN){ try{EU=await api("/api/eu");}catch(e){EU=null;} }
  render();
})();
})();
</script>
